name: 'CI/CD Pipeline'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. Detect which files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'

  # 2. Infrastructure Step
  terraform:
    name: 'Terraform'
    needs: changes
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        # Only apply on push to main AND if terraform files actually changed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.terraform == 'true'
        run: terraform apply -auto-approve -input=false

  # 3. Test Step
  test:
    name: 'Run Tests'
    needs: changes
    runs-on: ubuntu-latest
    # Run if mobile/shared files changed
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: ./apps/mobile
        run: npm test

  # 4. Deployment Step
  deploy:
    name: 'EAS Update'
    # Wait for BOTH infrastructure to be ready AND tests to pass
    needs: [changes, terraform, test]
    runs-on: ubuntu-latest
    # Deploy on ANY push to a branch (if mobile files changed)
    # PRs will only run Terraform Plan and Tests (no deploy)
    if: github.event_name == 'push' && needs.changes.outputs.mobile == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create update
        working-directory: ./apps/mobile
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BRANCH="production"
          else
            BRANCH="preview"
          fi
          eas update --branch $BRANCH --message "Update from GitHub Actions: $(git log -1 --pretty=%B)"
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
